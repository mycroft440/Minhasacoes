name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Preparar arquivo
        run: cp app/build/outputs/apk/release/app-release.apk MinhasAcoes.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinhasAcoes-apk
          path: MinhasAcoes.apk

      - name: Publicar na release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Minhas Ações — última versão
          body: |
            APK gerado automaticamente a partir da main (build ${{ github.run_number }}).
            Baixe **MinhasAcoes.apk** no celular e instale. Novas versões instalam por cima da anterior.
          files: MinhasAcoes.apk
          make_latest: true
